services:
  redis:
    image: redis:7-alpine
    restart: unless-stopped

  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: finmonitor
      POSTGRES_USER: finmonitor
      POSTGRES_PASSWORD: finmonitor
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U finmonitor -d finmonitor"]
      interval: 2s
      timeout: 3s
      retries: 10

  api1:
    build:
      context: ./backend/src
      dockerfile: FinMonitor.Api/Dockerfile
    environment: &api-env
      INSTANCE_NAME: api1
      Storage__Provider: Postgres
      Storage__ConnectionString: "Host=postgres;Port=5432;Database=finmonitor;Username=finmonitor;Password=finmonitor"
      Redis__Enabled: "true"
      Redis__ConnectionString: "redis:6379,abortConnect=false"
    depends_on:
      redis:
        condition: service_started
      postgres:
        condition: service_healthy

  api2:
    build:
      context: ./backend/src
      dockerfile: FinMonitor.Api/Dockerfile
    environment:
      <<: *api-env
      INSTANCE_NAME: api2
    depends_on:
      redis:
        condition: service_started
      postgres:
        condition: service_healthy

  api3:
    build:
      context: ./backend/src
      dockerfile: FinMonitor.Api/Dockerfile
    environment:
      <<: *api-env
      INSTANCE_NAME: api3
    depends_on:
      redis:
        condition: service_started
      postgres:
        condition: service_healthy

  frontend-lb:
    build:
      context: .
      dockerfile: docker/nginx-lb.Dockerfile
    ports:
      - "8080:80"
    depends_on:
      - api1
      - api2
      - api3

volumes:
  postgres-data:
