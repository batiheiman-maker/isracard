# Main nginx config for the LB demo image. worker_processes is pinned to 1 - nginx's classic
# round-robin balancer keeps its rotation state per worker process (no shared "zone" configured
# here, since none is needed beyond this demo), so with the default `auto` worker count on a
# multi-core machine, a handful of manual proof-curls can each land on a different, freshly
# started worker and appear to always hit the same upstream. One worker makes the round-robin
# sequence deterministic and actually observable for the curl-loop proof in the README.
worker_processes 1;

events {
    worker_connections 1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;
    sendfile      on;
    keepalive_timeout 65;
    include /etc/nginx/conf.d/*.conf;
}
