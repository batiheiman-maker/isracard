# Two upstream pools pointing at the same 3 replicas, with deliberately different stickiness:
#
# - finmonitor_api (plain round-robin): used for POST/GET /api/. No stickiness on purpose -
#   this is the exact path the assignment's bonus is about, and proving a POST landing on any
#   pod still reaches a client connected to a different pod (via the Redis backplane) is the
#   whole point of the demo.
#
# - finmonitor_api_sticky (ip_hash): used for /hubs/. This is NOT about the sync bug - it's a
#   separate, well-documented SignalR requirement: the "negotiate" HTTP call and the subsequent
#   WebSocket/SSE/LongPolling upgrade must land on the SAME server, because the connection id
#   only exists in that one process's memory. The Redis backplane broadcasts messages between
#   already-connected clients across pods; it does not (and cannot) share a live in-process
#   transport handle. Without this, negotiate could land on api1 and the follow-up WebSocket
#   request could land on api2, which has never heard of that connection id -> 404.
upstream finmonitor_api {
    server api1:8080;
    server api2:8080;
    server api3:8080;
}

upstream finmonitor_api_sticky {
    ip_hash;
    server api1:8080;
    server api2:8080;
    server api3:8080;
}

server {
    listen 80;

    location /api/ {
        proxy_pass http://finmonitor_api;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    location /hubs/ {
        proxy_pass http://finmonitor_api_sticky;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_read_timeout 3600s;
    }

    location / {
        root /usr/share/nginx/html;
        try_files $uri $uri/ /index.html;
    }
}
