# Plain round-robin (nginx's default) across the API replicas - deliberately NOT ip_hash /
# sticky sessions. Sticky sessions would hide the exact bug this stack is meant to prove is
# fixed (a client connected to pod A missing data POSTed to pod B); round-robin keeps the bug
# reproducible so the Redis backplane fix is actually exercised.
upstream finmonitor_api {
    server api1:8080;
    server api2:8080;
    server api3:8080;
}

server {
    listen 80;

    location /api/ {
        proxy_pass http://finmonitor_api;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    location /hubs/ {
        proxy_pass http://finmonitor_api;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_read_timeout 3600s;
    }

    location / {
        root /usr/share/nginx/html;
        try_files $uri $uri/ /index.html;
    }
}
