# Image is built from frontend/Dockerfile; its nginx.conf proxies /api and /hubs to the
# "finmonitor-api" Service by DNS name, so no ingress/CORS config is needed for this to work.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: finmonitor-frontend
  labels:
    app: finmonitor-frontend
spec:
  replicas: 2
  selector:
    matchLabels:
      app: finmonitor-frontend
  template:
    metadata:
      labels:
        app: finmonitor-frontend
    spec:
      containers:
        - name: frontend
          image: finmonitor-frontend:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 80
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 200m
              memory: 128Mi
