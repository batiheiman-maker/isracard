# Shared storage for the SQLite file across all API pod replicas (single source of truth for
# GET /api/transactions - see the ADR in README.md).
#
# ReadWriteOnce here because that's what this local single-node cluster's default storage class
# (rancher.io/local-path, via Docker Desktop's built-in Kubernetes) supports - and RWO is scoped
# per NODE, not per pod, so multiple pods CAN share it as long as they land on the same node,
# which they always will here (there's only one node).
#
# On a real multi-node production cluster, this would need to be ReadWriteMany instead (e.g. NFS,
# Azure Files, EFS via the efs-csi-driver) - most default cloud block storage classes (EBS
# gp2/gp3, GCE PD) are ReadWriteOnce only and would NOT let pods on different nodes share this.
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: finmonitor-sqlite-data
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 1Gi
