# Image is built from backend/src/FinMonitor.Api/Dockerfile (context: backend/src) and pushed
# to whatever registry the target cluster pulls from; update `image:` accordingly.
# `replicas: 5` mirrors the assignment's own framing ("if we deploy this backend to 5 pods...")
# and is just the starting point - once hpa.yaml is applied, the HorizontalPodAutoscaler takes
# over this field and adjusts it (3-10) based on memory load.
# imagePullPolicy: Always (not IfNotPresent) - on a local kind-based cluster (e.g. Docker
# Desktop's built-in Kubernetes), rebuilding an image under the SAME tag while iterating can
# leave a stale cached copy on the node even after `kubectl rollout restart`, since the node
# never re-checks a tag it already has under IfNotPresent. Hit this for real: after replacing
# SQLite with Postgres, pods kept silently running old in-memory-fallback code with zero
# Postgres connections, while POSTs still "succeeded" against each pod's own local memory -
# only visible as GET counts that varied per pod instead of matching the shared database. A
# real registry with immutable per-build tags wouldn't have this problem; Always is the
# pragmatic fix for local iteration against a cluster with no registry in front of it.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: finmonitor-api
  labels:
    app: finmonitor-api
spec:
  replicas: 5
  selector:
    matchLabels:
      app: finmonitor-api
  template:
    metadata:
      labels:
        app: finmonitor-api
    spec:
      containers:
        - name: api
          image: finmonitor-api:latest
          imagePullPolicy: Always
          ports:
            - containerPort: 8080
          env:
            - name: Storage__Provider
              value: "Postgres"
            - name: Storage__ConnectionString
              value: "Host=finmonitor-postgres;Port=5432;Database=finmonitor;Username=finmonitor;Password=finmonitor"
            - name: Redis__Enabled
              value: "true"
            - name: Redis__ConnectionString
              value: "finmonitor-redis:6379,abortConnect=false"
            - name: Deployment__Mode
              value: "Distributed"
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 256Mi
          # /healthz reflects StorageStartupHostedService's actual readiness (Postgres
          # connect-retry + schema init in distributed mode), not a hardcoded "Healthy" - so
          # startupProbe genuinely waits for storage, not just for the process to be alive.
          # Worst case in the app's own retry loop is ~10 attempts * (3s connect timeout + 2s
          # backoff) = ~50s; periodSeconds * failureThreshold here budgets ~75s, so a slow
          # Postgres start doesn't get the pod killed mid-retry. Until startupProbe succeeds
          # once, readiness/liveness are not evaluated at all (standard k8s behavior), so their
          # own initialDelaySeconds would be redundant.
          startupProbe:
            httpGet:
              path: /healthz
              port: 8080
            periodSeconds: 5
            failureThreshold: 15
          readinessProbe:
            httpGet:
              path: /healthz
              port: 8080
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /healthz
              port: 8080
            periodSeconds: 10
