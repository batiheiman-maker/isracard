# Standalone frontend image (used in k8s). /api/ proxies to the "finmonitor-api" Service
# (sessionAffinity: None - round-robin across pods, the exact path the distributed-sync proof
# is about). /hubs/ proxies to "finmonitor-api-hub" (k8s/service-hub.yaml), a separate Service
# over the SAME pods but with sessionAffinity: ClientIP - required so a client's negotiate call
# and its WebSocket/SSE upgrade land on the same pod (a SignalR requirement, unrelated to the
# Redis backplane). See the ADR in README.md.
server {
    listen 80;

    location /api/ {
        proxy_pass http://finmonitor-api:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    location /hubs/ {
        proxy_pass http://finmonitor-api-hub:8080;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_read_timeout 3600s;
    }

    location / {
        root /usr/share/nginx/html;
        try_files $uri $uri/ /index.html;
    }
}
