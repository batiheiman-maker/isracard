# Standalone frontend image (used in k8s). Proxies to the "finmonitor-api" Service DNS name,
# which is itself the load-balancing layer across the API's pod replicas - nginx here does not
# need its own upstream pool the way docker-compose's LB variant (docker/nginx-lb.conf) does.
server {
    listen 80;

    location /api/ {
        proxy_pass http://finmonitor-api:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    location /hubs/ {
        proxy_pass http://finmonitor-api:8080;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_read_timeout 3600s;
    }

    location / {
        root /usr/share/nginx/html;
        try_files $uri $uri/ /index.html;
    }
}
